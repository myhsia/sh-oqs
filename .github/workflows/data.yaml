name: Data
run-name: Data · ${{ inputs.configs || 'RUNLIST' }} · ${{ inputs.methods }}${{ inputs.label && format(' · {0}', inputs.label) || '' }}

on:
  workflow_dispatch:
    inputs:
      configs:
        description: "Space-separated config prefixes (default: A-base_line)."
        required: false
        default: ""
      cases:
        description: "Space-separated cases (default: qhm qah chm cah)."
        required: false
        default: "qhm qah chm cah"
      methods:
        description: "Space-separated methods (default: fssh mash)."
        required: false
        default: "fssh mash"
      n_traj:
        description: "Trajectories (empty: the per-method N_TRAJ budget)."
        required: false
        default: ""
      N:
        description: "Bath modes per case (default: 200)."
        required: false
        default: "200"
      njobs:
        description: "Inner workers per case (empty: share the job's cores)."
        required: false
        default: ""
      dt:
        description: "Time step (empty: the sh.py default, 0.005)."
        required: false
        default: ""
      wmax:
        description: "Quadrature cutoff in units of wC (default: 10)."
        required: false
        default: ""
      label:
        description: "Tag suffix, so a sweep does not overwrite the baseline."
        required: false
        default: ""
      sampling:
        description: "auto | quantum | classical (override the per-case choice)."
        required: false
        default: "auto"

permissions:
  contents: read

concurrency:
  # Unique per dispatch so independent sweep runs are not serialised.
  group: data-${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      configs: ${{ steps.plan.outputs.configs }}
      cases: ${{ steps.plan.outputs.cases }}
      methods: ${{ steps.plan.outputs.methods }}
    steps:
      - uses: actions/checkout@v7
      - name: Plan the run
        id: plan
        shell: bash
        run: |
          # Keep this default in step with sh.py's RUNLIST.
          default="A-base_line"
          list="${{ inputs.configs }}"
          cases="${{ inputs.cases }}"
          methods="${{ inputs.methods }}"
          list="${list:-$default}"
          cases="${cases:-qhm qah chm cah}"
          methods="${methods:-fssh mash}"
          python3 - "$list" "$cases" "$methods" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          print("configs=" + json.dumps(sys.argv[1].split()))
          print("cases=" + json.dumps(sys.argv[2].split()))
          print("methods=" + json.dumps(sys.argv[3].split()))
          PY

  build_env:
    name: Build environment (conda)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/sh-env
        with:
          build: "true"

  sh:
    name: sh (${{ matrix.config }} / ${{ matrix.case }} / ${{ matrix.method }})
    needs: [plan, build_env]
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        config: ${{ fromJSON(needs.plan.outputs.configs) }}
        case: ${{ fromJSON(needs.plan.outputs.cases) }}
        method: ${{ fromJSON(needs.plan.outputs.methods) }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/sh-env
      - name: Run surface hopping
        working-directory: source
        env:
          SH_CFG: ${{ matrix.config }}
          SH_CASE: ${{ matrix.case }}
          SH_METHOD: ${{ matrix.method }}
          SH_NTRAJ: ${{ inputs.n_traj }}
          SH_N: ${{ inputs.N }}
          SH_NJOBS: ${{ inputs.njobs }}
          SH_DT: ${{ inputs.dt }}
          SH_SAMPLING: ${{ inputs.sampling }}
          SH_WMAX: ${{ inputs.wmax }}
          SH_LABEL: ${{ inputs.label }}
        run: |
          conda activate sh
          python - <<'PY'
          import os, sh
          kw = {}
          if os.environ.get("SH_NTRAJ"): kw["n_traj"] = int(os.environ["SH_NTRAJ"])
          if os.environ.get("SH_N"):     kw["N"]      = int(os.environ["SH_N"])
          if os.environ.get("SH_NJOBS"): kw["njobs"]  = int(os.environ["SH_NJOBS"])
          if os.environ.get("SH_DT"):    kw["dt"]     = float(os.environ["SH_DT"])
          if os.environ.get("SH_SAMPLING"): kw["sampling"] = os.environ["SH_SAMPLING"]
          if os.environ.get("SH_WMAX"):   kw["wmax_factor"] = float(os.environ["SH_WMAX"])
          if os.environ.get("SH_LABEL"):  kw["label"] = os.environ["SH_LABEL"]
          sh.run(os.environ["SH_CFG"], methods=[os.environ["SH_METHOD"]],
                 cases=[os.environ["SH_CASE"]], **kw)
          PY
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sh-${{ matrix.config }}-${{ matrix.case }}-${{ matrix.method }}
          path: source/output/data/
          if-no-files-found: error
          retention-days: 30

  combine:
    name: Combine
    needs: [sh]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sh-*-*-*
          path: dist
          merge-multiple: true
      - name: Pack the whole run
        run: tar -czf sh-data.tar.gz -C dist .
      - uses: actions/upload-artifact@v7
        with:
          name: sh-data
          path: sh-data.tar.gz
          if-no-files-found: error
          retention-days: 30
